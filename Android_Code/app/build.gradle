apply plugin: 'com.android.application'

android {
    namespace "com.example.reverseshell2"
    compileSdkVersion 37        // Android 17 (API 37)
    buildToolsVersion "37.0.0"  // Ferramentas mais novas

    defaultConfig {
        applicationId "com.example.reverseshell2"
        minSdkVersion 21         // Android 5.0 (API 21) → ainda suporta aparelhos antigos
        targetSdkVersion 37      // Android 17 (API 37)
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'eu.bolt:screenshotty:1.0.2'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
